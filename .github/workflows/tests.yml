name: Reviewer verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip install bandit==1.8.6 pip-audit==2.9.0
      - run: python -m bandit -r -lll -ii router.py providers.py
      - run: python -m pip_audit --disable-pip --no-deps --strict -r requirements.lock
      - run: docker build -t reviewer-smoke .
      - name: Verify container
        run: |
          docker run -d --name reviewer-smoke -p 127.0.0.1:8000:8000 reviewer-smoke
          trap 'docker logs reviewer-smoke; docker rm -f reviewer-smoke' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/docs
